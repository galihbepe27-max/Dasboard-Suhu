<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Suhu Berbasis IoT</title>
    <link rel="stylesheet" href="style.css">
    <!-- MQTT -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌡 MONITORING SUHU BERBASIS IoT</h1>
            <p class="subtitle">Real-Time Temperature & Humidity Monitoring Dashboard</p>
            <div id="connection-status" class="status-badge">⏳ Menghubungkan...</div>
        </div>

        <div class="cards">
            <div class="card">
                <div class="icon">🌡</div>
                <h2>Suhu</h2>
                <p id="temp">--°C</p>
            </div>
            <div class="card">
                <div class="icon">💧</div>
                <h2>Kelembapan</h2>
                <p id="hum">--%</p>
            </div>
        </div>

        <div class="stats-container">
            <div class="stat-card">
                <h3>📊 Statistik Suhu</h3>
                <div>Maks: <span id="temp-max">--</span>°C</div>
                <div>Min: <span id="temp-min">--</span>°C</div>
                <div>Rata-rata: <span id="temp-avg">--</span>°C</div>
            </div>
            <div class="stat-card">
                <h3>💧 Statistik Kelembapan</h3>
                <div>Maks: <span id="hum-max">--</span>%</div>
                <div>Min: <span id="hum-min">--</span>%</div>
                <div>Rata-rata: <span id="hum-avg">--</span>%</div>
            </div>
        </div>

        <div class="chart-container">
            <h2>Grafik Monitoring (30 Data Terakhir)</h2>
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
